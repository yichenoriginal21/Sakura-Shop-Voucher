<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사쿠라 마켓 - 50,000원 공식 화폐 스타일 바우처</title>
    <!-- Include QRCode generator library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-bg: #09090b;
            --panel-bg: #18181b;
            --text-light: #f4f4f5;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Netflix-style Auth Gate Overlay */
        #authOverlay {
            position: fixed;
            inset: 0;
            background: #09090b;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: #18181b;
            border: 1px solid #27272a;
            padding: 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            text-align: center;
        }

        .auth-card h2 {
            color: #fbbf24;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .auth-card p {
            color: #a1a1aa;
            font-size: 13px;
        }

        .auth-card input {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            text-align: center;
        }

        .auth-card input:focus {
            border-color: #fbbf24;
        }

        .auth-btn {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-btn:hover {
            opacity: 0.9;
        }

        .auth-error {
            color: #fca5a5;
            font-size: 12px;
            display: none;
        }

        /* Main App Container */
        #appContainer {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            gap: 15px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 15px;
        }

        .header-title h1 {
            color: #fbbf24;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .header-title p {
            color: #a1a1aa;
            font-size: 13px;
        }

        .preview-card {
            background: var(--panel-bg);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: auto;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            background: #fff;
        }

        /* Hidden div to render QR Code for Canvas drawing */
        #qrcode-container {
            display: none;
        }

        .form-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 12px;
            color: #d4d4d8;
            font-weight: 600;
        }

        .form-group input {
            background: #09090b;
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #fbbf24;
        }

        .form-group input[readonly] {
            color: #a1a1aa;
            background: #18181b;
        }

        .btn-container {
            grid-column: 1 / -1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .btn {
            flex: 1;
            min-width: 130px;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
        }

        .btn-secondary {
            background: #27272a;
            color: #f4f4f5;
        }

        .btn-download {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .status-msg {
            grid-column: 1 / -1;
            font-size: 12px;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }

        .status-success {
            background: #064e3b;
            color: #34d399;
            display: block;
        }

        .status-loading {
            background: #1e3a8a;
            color: #93c5fd;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Hidden QR Code container -->
    <div id="qrcode-container"></div>

    <!-- Netflix-Style Owner Login Gate Overlay -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2>🔒 점주 전용 보안 인증</h2>
            <p>사쿠라 마켓 화폐 발행 시스템에 접근하려면 비밀번호를 입력하세요.</p>
            <input type="password" id="authPasswordInput" placeholder="Enter Owner Password...">
            <button class="auth-btn" onclick="authenticateOwner()">로그인 (Login)</button>
            <div id="authErrorMsg" class="auth-error">비밀번호가 올바르지 않습니다!</div>
        </div>
    </div>

    <!-- Main Builder Interface (Hidden until authenticated) -->
    <div id="appContainer">
        <div class="header-title">
            <h1>🇰🇷 사쿠라 마켓 - 50,000원 공식 화폐 스타일 바우처</h1>
            <p>점주 인증 완료된 공식 화폐 생성 시스템</p>
        </div>

        <div class="container" style="width: 100%;">
            <div class="preview-card">
                <canvas id="voucherCanvas" width="1320" height="580"></canvas>
            </div>

            <div class="form-card">
                <div class="form-group">
                    <label>금액 값 (Amount Value)</label>
                    <input type="number" id="amountInput" value="500">
                </div>

                <div class="form-group">
                    <label>일련번호 (Serial ID)</label>
                    <input type="text" id="serialInput" value="HF 1794971 E" readonly>
                </div>

                <div class="form-group full-width">
                    <label>수령인 이름 (Customer Name)</label>
                    <input type="text" id="nameInput" value="Arnab Deb">
                </div>

                <div class="form-group">
                    <label>발행일자 (Issue Date)</label>
                    <input type="text" id="issueDateInput" readonly>
                </div>

                <div class="form-group">
                    <label>유효기간 (Expiry Date)</label>
                    <input type="text" id="expiryDateInput" readonly>
                </div>

                <div class="form-group full-width">
                    <label>프로필 사진 업로드 (자동 흑백 뱅크노트 풍 변환)</label>
                    <input type="file" id="imageUpload" accept="image/*">
                </div>

                <div id="statusMsg" class="status-msg"></div>

                <div class="btn-container">
                    <button class="btn btn-secondary" onclick="generateNewSerial()">새 번호 생성</button>
                    <button class="btn btn-download" onclick="downloadCanvasAsPNG()">📥 PNG 다운로드</button>
                    <button class="btn btn-primary" onclick="syncAndDownloadPNG()">시트에 저장 및 PNG 다운로드</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "28282805";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwHa6QG1OzmwuBCGZQ5PvRDK-2S5bmeEcoP0m7ooZZSMbqmLlzqk6MuCiwPCXG0W6fI/exec";

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("sakura_owner_auth") === "true") {
                unlockApp();
            }
        });

        function authenticateOwner() {
            const entered = document.getElementById('authPasswordInput').value.trim();
            const errorMsg = document.getElementById('authErrorMsg');

            if (entered === ADMIN_PIN) {
                localStorage.setItem("sakura_owner_auth", "true");
                unlockApp();
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('authPasswordInput').value = '';
            }
        }

        function unlockApp() {
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
            initAutoDates();
            generateNewSerial();
        }

        const canvas = document.getElementById('voucherCanvas');
        const ctx = canvas.getContext('2d');
        let processedImageCanvas = null;
        let qrCodeImage = null;

        const amountInput = document.getElementById('amountInput');
        const serialInput = document.getElementById('serialInput');
        const nameInput = document.getElementById('nameInput');
        const issueDateInput = document.getElementById('issueDateInput');
        const expiryDateInput = document.getElementById('expiryDateInput');
        const imageUpload = document.getElementById('imageUpload');
        const statusMsg = document.getElementById('statusMsg');

        function initAutoDates() {
            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            issueDateInput.value = `${day}-${month}-${year}`;

            const expiry = new Date();
            expiry.setDate(today.getDate() + 7);
            const expDay = String(expiry.getDate()).padStart(2, '0');
            const expMonth = String(expiry.getMonth() + 1).padStart(2, '0');
            const expYear = expiry.getFullYear();
            expiryDateInput.value = `${expDay}-${expMonth}-${expYear}`;
        }

        [amountInput, nameInput].forEach(input => {
            input.addEventListener('input', drawVoucherNote);
        });

        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        processedImageCanvas = applyBanknoteFilter(img);
                        drawVoucherNote();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function applyBanknoteFilter(img) {
            const tempCanvas = document.createElement('canvas');
            const tCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 380;
            tempCanvas.height = 460;

            tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
            const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                let gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                gray = (gray - 128) * 1.3 + 128;
                gray = Math.min(255, Math.max(0, gray));

                d[i] = gray * 0.92;
                d[i+1] = gray * 0.94;
                d[i+2] = gray * 0.97;
            }
            tCtx.putImageData(imgData, 0, 0);
            return tempCanvas;
        }

        function generateNewSerial() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const prefix = letters.charAt(Math.floor(Math.random() * 26)) + letters.charAt(Math.floor(Math.random() * 26));
            const num = Math.floor(1000000 + Math.random() * 9000000);
            const suffix = letters.charAt(Math.floor(Math.random() * 26));
            serialInput.value = `${prefix} ${num} ${suffix}`;
            
            createQRCodeAndRedraw(serialInput.value);
        }

        function createQRCodeAndRedraw(text) {
            const container = document.getElementById('qrcode-container');
            container.innerHTML = "";
            
            // QR কোডের ভেতরে সরাসরি অটো-রিডিম লিংক এম্বেড করা হলো
            const directRedeemURL = `${SCRIPT_URL}?action=redeem&voucherId=${encodeURIComponent(text.trim())}`;

            new QRCode(container, {
                text: directRedeemURL,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            setTimeout(() => {
                const qrImgElement = container.querySelector('img');
                if (qrImgElement) {
                    qrCodeImage = new Image();
                    qrCodeImage.src = qrImgElement.src;
                }
                drawVoucherNote();
            }, 120);
        }

        function drawGuillocheBorder() {
            ctx.save();
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 1.5;
            
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
            ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(180, 83, 9, 0.4)';
            for (let x = 25; x < canvas.width - 25; x += 15) {
                ctx.beginPath();
                ctx.moveTo(x, 16);
                ctx.lineTo(x + 5, 26);
                ctx.lineTo(x + 10, 16);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x, canvas.height - 16);
                ctx.lineTo(x + 5, canvas.height - 26);
                ctx.lineTo(x + 10, canvas.height - 16);
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawVoucherNote() {
            const amt = amountInput.value || "500";

            const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            bgGrad.addColorStop(0, '#fef08a');
            bgGrad.addColorStop(0.3, '#fde047');
            bgGrad.addColorStop(0.7, '#eab308');
            bgGrad.addColorStop(1, '#ca8a04');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGuillocheBorder();

            ctx.save();
            ctx.fillStyle = 'rgba(74, 124, 89, 0.15)';
            ctx.beginPath();
            ctx.moveTo(350, 200);
            ctx.bezierCurveTo(450, 100, 600, 300, 750, 180);
            ctx.lineTo(750, 220);
            ctx.bezierCurveTo(600, 340, 450, 150, 350, 240);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'rgba(120, 53, 15, 0.12)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.arc(500 + i * 18, 220 + (i % 2) * 15, 12, 0, Math.PI * 2);
                ctx.arc(520 + i * 15, 235 + (i % 2) * 12, 10, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            const foilGrad = ctx.createLinearGradient(30, 0, 110, 0);
            foilGrad.addColorStop(0, '#1e293b');
            foilGrad.addColorStop(0.3, '#64748b');
            foilGrad.addColorStop(0.6, '#cbd5e1');
            foilGrad.addColorStop(1, '#334155');
            ctx.fillStyle = foilGrad;
            ctx.fillRect(30, 30, 75, canvas.height - 60);

            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 18px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(amt, 67, 120);

            ctx.beginPath();
            ctx.arc(67, 240, 24, 0, Math.PI * 2);
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillText(amt, 67, 360);
            
            ctx.font = 'bold 13px monospace';
            ctx.fillText(`SKR-${amt}`, 67, 480);
            ctx.restore();

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(serialInput.value, 135, 55);

            ctx.beginPath();
            ctx.arc(420, 48, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#dc2626';
            ctx.fill();
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 26px "Segoe UI", sans-serif';
            ctx.fillText('한국은행 • 사쿠라 마켓', 445, 56);

            ctx.font = '900 42px "Segoe UI", serif';
            ctx.fillStyle = '#111827';
            ctx.fillText('오만원권 바우처', 445, 115);

            ctx.fillStyle = '#0f172a';
            ctx.font = '900 95px "Arial Black", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`৳${amt}`, 135, 300);

            ctx.font = 'bold 15px serif';
            ctx.fillStyle = '#78350f';
            ctx.fillText('OFFICIAL SAKURA MARKET TREASURY NOTE', 140, 335);

            ctx.fillStyle = '#1e293b';
            ctx.font = 'bold 20px "Segoe UI", sans-serif';
            ctx.fillText(`수령인 (Customer): ${nameInput.value || '___________'}`, 140, 390);

            ctx.fillStyle = '#b45309';
            ctx.fillRect(140, 415, 230, 34);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`ISSUE : ${issueDateInput.value}`, 255, 437);

            ctx.fillStyle = '#78350f';
            ctx.fillRect(385, 415, 230, 34);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px monospace';
            ctx.fillText(`EXPIRY : ${expiryDateInput.value}`, 500, 437);

            ctx.fillStyle = '#374151';
            ctx.font = 'bold 16px serif';
            ctx.textAlign = 'left';
            ctx.fillText('총재인', 475, 365);
            drawRedSquareGovernorSeal(530, 360);

            // Large QR Code Placement
            if (qrCodeImage) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(710, 140, 150, 150);
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 3;
                ctx.strokeRect(710, 140, 150, 150);
                ctx.drawImage(qrCodeImage, 718, 148, 134, 134);
            }

            ctx.save();
            ctx.beginPath();
            ctx.ellipse(1070, 275, 170, 210, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#fffbeb';
            ctx.fill();
            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.clip();

            if (processedImageCanvas) {
                ctx.drawImage(processedImageCanvas, 900, 60, 340, 430);
            } else {
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(900, 60, 340, 430);

                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(1070, 160, 80, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.ellipse(1070, 210, 50, 65, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#334155';
                ctx.fillRect(980, 310, 180, 180);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(canvas.width - 45, 180);
            ctx.rotate(Math.PI / 2);
            ctx.fillStyle = '#1e293b';
            ctx.font = '900 65px "Arial Black", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(amt, 0, 0);
            ctx.restore();

            ctx.fillStyle = '#dc2626';
            ctx.font = 'bold 18px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(serialInput.value, canvas.width - 130, canvas.height - 35);
        }

        function drawRedSquareGovernorSeal(x, y) {
            ctx.save();
            ctx.strokeStyle = '#dc2626';
            ctx.fillStyle = 'rgba(220, 38, 38, 0.15)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y - 18, 26, 26);
            ctx.fillRect(x, y - 18, 26, 26);

            ctx.fillStyle = '#dc2626';
            ctx.font = '900 9px serif';
            ctx.textAlign = 'center';
            ctx.fillText('한銀', x + 13, y - 6);
            ctx.fillText('총재', x + 13, y + 4);
            ctx.restore();
        }

        function downloadCanvasAsPNG() {
            const imageURI = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            const serialName = serialInput.value.replace(/\s+/g, '_');
            link.download = `Sakura_Currency_Voucher_${serialName}.png`;
            link.href = imageURI;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusMsg.className = 'status-msg status-success';
            statusMsg.innerText = '화폐 스타일 바우처 PNG 다운로드 완료!';
            setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
        }

        async function syncAndDownloadPNG() {
            statusMsg.className = 'status-msg status-loading';
            statusMsg.innerText = '구글 시트에 저장 및 PNG 다운로드 진행 중...';

            const payload = new URLSearchParams({
                'voucherId': serialInput.value,
                'customerName': nameInput.value || 'Walk-in Counter Customer',
                'phone': 'N/A',
                'issueDate': issueDateInput.value,
                'expiryDate': expiryDateInput.value,
                'amount': `৳${amountInput.value}`
            });

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: payload
                });

                downloadCanvasAsPNG();

                statusMsg.className = 'status-msg status-success';
                statusMsg.innerText = '시트에 성공적으로 저장되었으며 PNG가 다운로드 되었습니다!';

                setTimeout(() => {
                    generateNewSerial();
                }, 500);

            } catch (err) {
                console.error(err);
                downloadCanvasAsPNG();
                statusMsg.className = 'status-msg status-success';
                statusMsg.innerText = 'PNG 다운로드가 완료 되었습니다!';
            }
        }
    </script>
</body>
</html>
